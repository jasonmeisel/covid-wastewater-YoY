name: Update PMC data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fetch-pmc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make fetch script executable
        run: chmod +x ./fetch-pmc.sh

      - name: Run PMC fetch
        run: ./fetch-pmc.sh

      - name: Commit updated PMC data
        env:
          COMMIT_MESSAGE: "Update PMC19 county COVID data ($(date -u +'%Y-%m-%d'))"
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ${{ env.COMMIT_MESSAGE }}
          file_pattern: pmc-current.json
